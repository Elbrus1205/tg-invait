services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.production
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 4000
      NODE_ENV: production
    restart: unless-stopped
    expose:
      - "4000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env.production
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: https://efootball-nexon.ru
    env_file: .env.production
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
